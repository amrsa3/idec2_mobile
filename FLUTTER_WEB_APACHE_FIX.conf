# Flutter Web Apache Configuration Fix
# إعدادات Apache لإصلاح مشاكل Flutter Web

<VirtualHost *:8080>
    ServerName app.idec-ye.com
    
    # Frontend (Flutter Web App)
    DocumentRoot /home/app/public_html
    
    <Directory /home/app/public_html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Flutter Web specific settings
        <Files "*.js">
            Header set Content-Type "application/javascript"
            Header set Cache-Control "public, max-age=31536000"
        </Files>
        
        <Files "*.wasm">
            Header set Content-Type "application/wasm"
            Header set Cache-Control "public, max-age=31536000"
        </Files>
        
        <Files "*.dart">
            Header set Content-Type "application/dart"
            Header set Cache-Control "public, max-age=31536000"
        </Files>
        
        <Files "*.json">
            Header set Content-Type "application/json"
            Header set Cache-Control "public, max-age=31536000"
        </Files>
    </Directory>
    
    # API Proxy to Node.js Backend
    ProxyPreserveHost On
    ProxyPass /api/ http://localhost:3000/api/
    ProxyPassReverse /api/ http://localhost:3000/api/
    
    # Health Check Proxy
    ProxyPass /health http://localhost:3000/health
    ProxyPassReverse /health http://localhost:3000/health
    
    # Enable CORS for API requests
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    
    # Flutter Web specific headers
    Header always set Cross-Origin-Embedder-Policy "require-corp"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    
    # Content Security Policy for Flutter Web
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https://www.gstatic.com; script-src-elem 'self' 'unsafe-inline' blob: data: https://www.gstatic.com; style-src 'self' 'unsafe-inline' blob: data:; font-src 'self' data: blob:; img-src 'self' data: blob: https:; connect-src 'self' http://app.idec-ye.com http://idec-ye.com http://localhost:8080 blob: data: ws: wss:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
    
    # Handle preflight requests
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]
</VirtualHost>

