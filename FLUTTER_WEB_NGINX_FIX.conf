# Flutter Web Nginx Configuration Fix
# إعدادات Nginx لإصلاح مشاكل Flutter Web

server {
    listen 80;
    listen [::]:80;
    server_name app.idec-ye.com;
    
    root /home/app/public_html;
    index index.html;
    
    # Flutter Web specific settings
    location ~* \.(js|wasm|dart|json)$ {
        add_header Content-Type "application/javascript";
        add_header Cache-Control "public, max-age=31536000";
        expires 1y;
    }
    
    location ~* \.wasm$ {
        add_header Content-Type "application/wasm";
        add_header Cache-Control "public, max-age=31536000";
        expires 1y;
    }
    
    location ~* \.dart$ {
        add_header Content-Type "application/dart";
        add_header Cache-Control "public, max-age=31536000";
        expires 1y;
    }
    
    location ~* \.json$ {
        add_header Content-Type "application/json";
        add_header Cache-Control "public, max-age=31536000";
        expires 1y;
    }
    
    # Flutter Web specific headers
    add_header Cross-Origin-Embedder-Policy "require-corp";
    add_header Cross-Origin-Opener-Policy "same-origin";
    
    # Content Security Policy for Flutter Web
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https://www.gstatic.com; script-src-elem 'self' 'unsafe-inline' blob: data: https://www.gstatic.com; style-src 'self' 'unsafe-inline' blob: data:; font-src 'self' data: blob:; img-src 'self' data: blob: https:; connect-src 'self' http://app.idec-ye.com http://idec-ye.com http://localhost:8080 blob: data: ws: wss:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';";
    
    # CORS headers
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
    
    # API Proxy to Node.js Backend
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health Check Proxy
    location /health {
        proxy_pass http://localhost:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Flutter Web routing
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

