# Gradle JVM arguments - optimized for memory issues
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:-UseParallelGC -XX:+UseG1GC

# Enable AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Kotlin daemon JVM arguments to fix compilation issues
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:-UseParallelGC -XX:+UseG1GC

# Disable parallel builds to save memory
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=false

# Disable incremental compilation to save memory
kotlin.incremental=false
kotlin.incremental.android=false

# Disable unnecessary features to save memory
android.enableR8.fullMode=false
android.enableBuildCache=false

# Additional memory optimizations
org.gradle.workers.max=1
org.gradle.caching=false

# Force Java 17 for all tasks
kotlin.jvm.target.validation.mode=warning

# Suppress Java source/target deprecation warnings
android.javaCompile.suppressSourceTargetDeprecationWarning=true
