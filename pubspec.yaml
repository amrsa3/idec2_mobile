name: idec_conference_app
description: 'معرض ومؤتمر IDEC لطب الاسنان 2026 - تطبيق Flutter احترافي لإدارة المؤتمر'
publish_to: 'none'

version: 2.0.5
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.4

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  http: ^1.1.0

  # UI & Navigation
  go_router: ^12.1.3
  flutter_localizations:
    sdk: flutter
  intl: any

  # Storage & Cache
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Database
  sqflite: ^2.3.0

  # Utilities
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1

  # Security & Encryption
  crypto: ^3.0.3

  # Freezed for immutable models
  freezed: ^2.4.6

  # Device Features
  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  file_picker: ^8.1.6

  # UI Components
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_svg: ^2.0.9
  flutter_countdown_timer: 4.1.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Connectivity & Network
  connectivity_plus: ^5.0.2
  internet_connection_checker: ^1.0.0+1

  # OTP & PIN Input
  pin_code_fields: ^8.0.1

  # Country Code Picker
  country_code_picker: ^3.0.0

  # Image Cropping & Compression
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0
  photo_view: ^0.15.0

  # Path Provider
  path_provider: ^2.1.1

  # Device Info
  device_info_plus: ^9.1.1

  # Package Info
  package_info_plus: ^4.2.0

  # Share functionality
  share_plus: ^7.2.1

  # URL Launcher
  url_launcher: ^6.2.2

  # PDF generation
  printing: ^5.13.1
  pdf: ^3.11.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^3.0.1

  # Testing
  mockito: ^5.4.2

  # Icon Generation
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    # Arabic fonts
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-ExtraBold.ttf
          weight: 800
    # English fonts
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
    # Fallback font (removed Tahoma - using Cairo as primary Arabic font)
    # Note: Tahoma is a Microsoft proprietary font, Cairo provides better Arabic support

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    background_color: '#fe0303'
    theme_color: '#fe0303'
  image_path: '../images/App icon 02.ico'
  adaptive_icon_background: '#fe0303'
  adaptive_icon_foreground: '../images/App icon 02.ico'
