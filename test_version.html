<!DOCTYPE html>
<html>
<head>
    <title>Version Test</title>
</head>
<body>
    <h1>Version Test Page</h1>
    <p>Current Time: <span id="time"></span></p>
    <p>Test Version: 2.0.1</p>
    <p>Build Time: 28 October 2025</p>
    
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString();
        console.log('🚀 Test page loaded at:', new Date().toISOString());
        console.log('📦 Test Version: 2.0.1');
        console.log('🏗️ Build Time: 28 October 2025');
    </script>
</body>
</html>
