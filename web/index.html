  <!-- Font fallbacks and CSS for text rendering -->
  <style>
    /* Primary font stack with local fonts only */
    :root {
      --primary-font: 'Cairo', 'NotoSansArabic', 'Roboto', 'Tahoma', Arial, sans-serif;
      --fallback-font: 'NotoSansArabic', 'Roboto', 'Tahoma', Arial, sans-serif;
    }
    
    /* Force immediate text visibility */
    body, html {
      font-family: var(--primary-font) !important;
      font-display: swap !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      direction: rtl;
      text-align: right;
    }
    
    /* Ensure all text is visible immediately */
    *, *::before, *::after {
      font-family: var(--primary-font) !important;
      font-display: swap !important;
      text-rendering: optimizeLegibility;
    }
    
    /* Flutter Web specific fixes */
    flt-glass-pane, flt-glass-pane * {
      font-family: var(--primary-font) !important;
      font-display: swap !important;
    }
    
    /* Force text visibility for all Flutter elements */
    flutter-view, flutter-view * {
      font-family: var(--primary-font) !important;
      font-display: swap !important;
    }
    
    /* Arabic text support with better fallbacks */
    [dir="rtl"], [lang="ar"] {
      font-family: var(--primary-font) !important;
      font-display: swap !important;
      unicode-bidi: bidi-override;
      direction: rtl;
    }
    
    /* English text support */
    [dir="ltr"], [lang="en"] {
      font-family: var(--fallback-font) !important;
      direction: ltr;
      text-align: left;
    }
    
    /* Prevent invisible text during font swap */
    .flutter-loader {
      font-family: var(--fallback-font) !important;
    }
    
    /* Force text visibility */
    * {
      font-display: swap !important;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Ensure all text is visible */
    body, html, flt-glass-pane, flt-scene-host {
      font-family: var(--primary-font) !important;
      color: #000 !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
    
    /* Loading state with visible text */
    .loading-text {
      font-family: var(--fallback-font) !important;
      font-size: 16px;
      color: #333;
      text-align: center;
      margin: 20px;
    }
    
    /* Ensure proper font loading */
    @media (prefers-reduced-motion: no-preference) {
      * {
        font-display: swap !important;
      }
    }
  </style>
</head>
<body>
  <!-- Loading indicator with visible text -->
  <div id="loading" class="loading-text">
    <p>جاري تحميل منصة IDEC...</p>
    <p>Loading IDEC Platform...</p>
  </div>
  
  <script src="flutter_web_config.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Service Worker Version
    var serviceWorkerVersion = "1201463201";
    
    // Modern Flutter Web initialization (3.x+)
    window.addEventListener('load', function(ev) {
      // Use the new Flutter loader API
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        config: window.flutterWebConfig || {
          renderer: "html",
          fontFallbacks: [
            'system-ui',
            '-apple-system', 
            'BlinkMacSystemFont',
            'Segoe UI',
            'Arial',
            'Helvetica',
            'Tahoma',
            'sans-serif'
          ]
        }
      }).then(function(appRunner) {
        appRunner.runApp();
        
        // Hide loading indicator when Flutter is ready
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.display = 'none';
        }
      });
    });
    
    // Fallback: hide loading after 15 seconds
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    }, 15000);
  </script>
</body>
