<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="idec_conference_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <!-- Google Fonts for Arabic and English text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <title>idec_conference_app</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Font fallbacks and CSS for text rendering -->
  <style>
    /* Force immediate text visibility */
    body, html {
      font-family: Arial, Helvetica, sans-serif !important;
      font-display: block !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Ensure all text is visible immediately */
    *, *::before, *::after {
      font-family: Arial, Helvetica, sans-serif !important;
      font-display: block !important;
      text-rendering: optimizeLegibility;
    }
    
    /* Flutter Web specific fixes */
    flt-glass-pane, flt-glass-pane * {
      font-family: Arial, Helvetica, sans-serif !important;
      font-display: block !important;
    }
    
    /* Force text visibility for all Flutter elements */
    flutter-view, flutter-view * {
      font-family: Arial, Helvetica, sans-serif !important;
      font-display: block !important;
    }
    
    /* Arabic text support */
    [dir="rtl"], [lang="ar"] {
      font-family: Tahoma, Arial, sans-serif !important;
      font-display: block !important;
    }
    
    /* Prevent invisible text during font swap */
    .flutter-loader {
      font-family: Arial, Helvetica, sans-serif !important;
    }
  </style>
</head>
<body>
  <script src="flutter_web_config.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
