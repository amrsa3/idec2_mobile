  <!-- Simple Google Fonts blocking -->
  <script>
    // Simple Google Fonts blocking
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
      const url = typeof input === 'string' ? input : (input && input.url);
      if (url && (url.includes('fonts.googleapis.com') || url.includes('fonts.gstatic.com'))) {
        return Promise.reject(new Error('Google Fonts blocked'));
      }
      return originalFetch.apply(this, arguments);
    };
    console.log('🚫 Google Fonts blocked');
  </script>

<body>
  <!-- Fast loading indicator -->
  <div id="loading" class="loading-text">
    <div style="text-align: center; padding: 20px;">
      <div style="font-size: 32px; margin-bottom: 10px;">🚀</div>
      <h3>جاري تحميل منصة IDEC...</h3>
      <p>Loading IDEC Platform...</p>
      <div style="margin-top: 20px;">
        <div style="width: 200px; height: 4px; background: #f0f0f0; border-radius: 2px; margin: 0 auto;">
          <div id="progress" style="width: 0%; height: 100%; background: #2196F3; border-radius: 2px; transition: width 0.3s ease;"></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Fast Flutter Web initialization -->
  <script src="flutter_web_config.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Service Worker Version
    var serviceWorkerVersion = "1201463201";
    var flutterInitialized = false;
    
    // Fast initialization - start immediately
    console.log('🚀 Starting fast Flutter initialization...');
    
    // Progress bar simulation
    let progress = 0;
    const progressBar = document.getElementById('progress');
    const updateProgress = function() {
      if (progress < 90) {
        progress += Math.random() * 10;
        if (progressBar) {
          progressBar.style.width = progress + '%';
        }
        setTimeout(updateProgress, 100);
      }
    };
    updateProgress();
    
    // Check if Flutter is already available
    if (window._flutter && window._flutter.loader) {
      console.log('✅ Flutter loader already available - starting immediately');
      flutterInitialized = true;
      
      window._flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(appRunner) {
        console.log('✅ Flutter ready - starting app...');
        appRunner.runApp();
        
        // Complete progress and hide loading
        if (progressBar) {
          progressBar.style.width = '100%';
        }
        setTimeout(function() {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.display = 'none';
          }
          console.log('🎉 Flutter app started successfully!');
        }, 200);
      }).catch(function(error) {
        console.error('❌ Flutter load error:', error);
        flutterInitialized = false;
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.display = 'none';
        }
      });
    } else {
      // Wait for flutter_bootstrap.js with shorter timeout
      console.log('⏳ Waiting for flutter_bootstrap.js...');
      
      let attempts = 0;
      const maxAttempts = 10; // 5 seconds max
      
      const checkFlutter = function() {
        attempts++;
        
        if (window._flutter && window._flutter.loader) {
          console.log('✅ Flutter loader now available');
          flutterInitialized = true;
          
          window._flutter.loader.load({
            serviceWorkerSettings: {
              serviceWorkerVersion: serviceWorkerVersion,
            }
          }).then(function(appRunner) {
            console.log('✅ Flutter ready - starting app...');
            appRunner.runApp();
            
            // Complete progress and hide loading
            if (progressBar) {
              progressBar.style.width = '100%';
            }
            setTimeout(function() {
              const loading = document.getElementById('loading');
              if (loading) {
                loading.style.display = 'none';
              }
              console.log('🎉 Flutter app started successfully!');
            }, 200);
          }).catch(function(error) {
            console.error('❌ Flutter load error:', error);
            flutterInitialized = false;
            const loading = document.getElementById('loading');
            if (loading) {
              loading.style.display = 'none';
            }
          });
        } else if (attempts < maxAttempts) {
          setTimeout(checkFlutter, 500); // Check every 500ms
        } else {
          console.error('❌ Flutter loader not available after timeout');
          flutterInitialized = false;
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.display = 'none';
          }
          document.body.innerHTML = '<div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;"><div style="font-size: 24px; margin-bottom: 20px;">❌</div><h2>خطأ في تحميل التطبيق</h2><p>Error loading application</p><p>يرجى إعادة تحميل الصفحة</p></div>';
        }
      };
      
      // Start checking immediately
      setTimeout(checkFlutter, 100);
    }
    
    // Faster fallback - show message after 8 seconds
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading && loading.style.display !== 'none') {
        loading.innerHTML = '<div style="text-align: center; padding: 50px;"><div style="font-size: 24px; margin-bottom: 20px;">⏳</div><h2>جاري التحميل...</h2><p>Loading...</p><p>يرجى الانتظار قليلاً</p></div>';
      }
    }, 8000);
  </script>
</body>
