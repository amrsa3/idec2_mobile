    flutter-view, flutter-view * {
      font-family: var(--primary-font) !important;
      font-display: swap !important;
    }
    
    /* Loading state with visible text */
    .loading-text {
      font-family: var(--primary-font) !important;
      font-size: 16px;
      color: #333;
      text-align: center;
      margin: 20px;
    }

<body>
  <!-- Loading indicator with visible text -->
  <div id="loading" class="loading-text">
    <p>جاري تحميل منصة IDEC...</p>
    <p>Loading IDEC Platform...</p>
  </div>
  
  <script src="flutter_web_config_simple.js"></script>
  
  <script>
    // Service Worker Version
    var serviceWorkerVersion = "1201463201";
    
    // Simplified Flutter Web initialization
    window.addEventListener('load', function(ev) {
      // Use the new Flutter loader API
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        config: window.flutterWebConfig || {
          renderer: "html",
          fontFallbacks: [
            'Cairo',
            'NotoSansArabic',
            'Roboto',
            'system-ui',
            '-apple-system', 
            'BlinkMacSystemFont',
            'Segoe UI',
            'Arial',
            'Helvetica',
            'Tahoma',
            'sans-serif'
          ]
        }
      }).then(function(appRunner) {
        appRunner.runApp();
        
        // Hide loading indicator when Flutter is ready
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.display = 'none';
        }
      }).catch(function(error) {
        console.error('Flutter Web initialization error:', error);
        
        // Show error message
        const loading = document.getElementById('loading');
        if (loading) {
          loading.innerHTML = '<p style="color: red; text-align: center; padding: 20px;">خطأ في تحميل التطبيق<br/>Error loading application<br/>Please refresh the page</p>';
          loading.style.display = 'block';
        }
      });
    });
    
    // Fallback: hide loading after 15 seconds
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    }, 15000);
  </script>
</body>
